services:
  ndox:
    build: .
    image: ndox:local
    env_file:
      - path: .env
        required: false
    environment:
      # docker default: simulated wallet, no publishing to real relays unless configured
      WALLET_MODE: ${WALLET_MODE:-fake}
      DATABASE_PATH: /data/ndox.sqlite
      PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ndox-data:/data
    restart: unless-stopped

volumes:
  ndox-data: {}
